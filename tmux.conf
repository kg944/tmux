# tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
#monokai pro theme
#set -g @plugin 'loctvl842/monokai-pro.tmux'
#set -g @plugin 'maxpetretta/tmux-monokai-pro'

run '~/.tmux/plugins/tpm/tpm'

# new sessions/windows in current dirrectory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# nord theme
#set -g @plugin "arcticicestudio/nord-tmux"
# gruvbox theme
# set -g @tmux-gruvbox 'dark' or 'light'
# set -g @plugin 'egel/tmux-gruvbox'

# Fix Colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows
set-option -g renumber-windows on

# vim-like copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# stop renaming windows automatically
set-option -g allow-rename off

# Statusline location
set -g status-position bottom

# Current window name bold
#set -g window-status-current-style fg=terminal,bold

# Time settings
#set -g status-right '#(TZ="America/New_York" date +"%%a %%b %%-d %%-I:%%M %%p ")'

# make clock mode display 12h time (TODO: still wrong timezone)
set-window-option -g clock-mode-style 12

# Increase left length
set -g status-left-length 30

# disable pane navigation wrap around
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" { send-keys C-h } { if-shell -F '#{pane_at_left}'   {} { select-pane -L } }
bind-key -n 'C-j' if-shell "$is_vim" { send-keys C-j } { if-shell -F '#{pane_at_bottom}' {} { select-pane -D } }
bind-key -n 'C-k' if-shell "$is_vim" { send-keys C-k } { if-shell -F '#{pane_at_top}'    {} { select-pane -U } }
bind-key -n 'C-l' if-shell "$is_vim" { send-keys C-l } { if-shell -F '#{pane_at_right}'  {} { select-pane -R } }

bind-key -T copy-mode-vi 'C-h' if-shell -F '#{pane_at_left}'   {} { select-pane -L }
bind-key -T copy-mode-vi 'C-j' if-shell -F '#{pane_at_bottom}' {} { select-pane -D }
bind-key -T copy-mode-vi 'C-k' if-shell -F '#{pane_at_top}'    {} { select-pane -U }

# Monokai Pro colors

set -g @white "#fcfcfa"
set -g @black "#2d2a2e"
set -g @dark_gray "#403e41"
set -g @gray "#727072"
set -g @red "#ff6188"
set -g @green "#a9dc76"
set -g @yellow "#ffd866"
set -g @blue "#78dce8"
set -g @magenta "#fc9867"
set -g @cyan "#ab9df2"

set -g mode-style "fg=\#{@white},bg=\#{@gray}"
set -g message-style "fg=\#{@white},bg=\#{@gray}"
set -g message-command-style "fg=\#{@white},bg=\#{@gray}"

set -g pane-border-style "fg=\#{@gray}"
set -g pane-active-border-style "fg=\#{@white}"

set -g status "on"
set -g status-justify "left"
set -g status-style "fg=\#{@white},bg=\#{@black}"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=\#{@black},bg=\#{@green},bold]#{?#{m/r:(copy|view)-mode,#{pane_mode}},#[bg=#{@cyan}],}#{?client_prefix,#[bg=#{@magenta}],} #S #[fg=\#{@green},bg=\#{@black},nobold,nounderscore,noitalics]#{?client_prefix,#[fg=#{@magenta}],}#{?#{m/r:(copy|view)-mode,#{pane_mode}},#[fg=#{@cyan}],}"

set -g status-right "#[fg=\#{@black},bg=\#{@black},nobold,nounderscore,noitalics]#[fg=\#{@white},bg=\#{@black}] #{prefix_highlight} #[fg=\#{@gray},bg=\#{@black},nobold,nounderscore,noitalics]#[fg=\#{@white},bg=\#{@gray}] %-m/%-d/%y  %-I:%M%P #[fg=\#{@white},bg=\#{@gray},nobold,nounderscore,noitalics]#[fg=\#{@black},bg=\#{@white},bold] #h "

setw -g window-status-activity-style "underscore,fg=\#{@gray},bg=\#{@black}"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=\#{@white},bg=\#{@gray}"
setw -g window-status-format "#[fg=\#{@black},bg=\#{@gray},nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=\#{@gray},bg=\#{@black},nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=\#{@black},bg=\#{@white},nobold,nounderscore,noitalics]#[fg=\#{@black},bg=\#{@white},bold] #I  #W #F #[fg=\#{@white},bg=\#{@black},nobold,nounderscore,noitalics]"

# tmux-plugins/tmux-prefix-highlight support
set -g @prefix_highlight_output_prefix "#[fg=\#{@yellow}]#[bg=\#{@black}]#[fg=\#{@black}]#[bg=\#{@yellow}]"
set -g @prefix_highlight_output_suffix ""
